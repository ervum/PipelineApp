@if (open()) {
  <div class="fs-modal-backdrop" (click)="onBackdropClick()">
    <div
      [class]="'fs-modal fs-modal--' + size()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Modal dialog'"
      (click)="$event.stopPropagation()"
    >
      <header class="fs-modal__header">
        <h2 class="fs-h3">{{ title() }}</h2>
        <button
          type="button"
          fsBtn
          variant="ghost"
          size="icon"
          aria-label="Close modal"
          (click)="close()"
        >
          <fs-icon name="x" [size]="16" />
        </button>
      </header>
      <div class="fs-modal__body">
        <ng-content />
      </div>
      <footer class="fs-modal__footer">
        <ng-content select="[modalFooter]" />
      </footer>
    </div>
  </div>
}
